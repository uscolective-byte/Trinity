name: Cloudflare Trinity Staging

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Validate only, or deploy inaccessible private staging Worker'
        type: choice
        required: true
        default: validate
        options:
          - validate
          - deploy-private

permissions:
  contents: read

concurrency:
  group: cloudflare-trinity-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test Trinity and bundle Worker
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Validate private staging Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.staging.toml --outdir .wrangler/staging-ci

  deploy-private:
    name: Provision and deploy non-public staging
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-private' }}
    environment: trinity-staging
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID GitHub secret"; exit 1; }

      - name: Create/find isolated EU staging D1 and generate binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/prepare_cloudflare_staging.py

      - name: Apply D1 dialogue schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute trinity-dialogue-staging-db --remote --file migrations/0001_trinity_dialogue.sql --config wrangler.staging.generated.toml --yes

      - name: Deploy separate Worker without routes or workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.staging.generated.toml

      - name: Configure Gemini key if provided
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY --config wrangler.staging.generated.toml
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "### Trinity Cloudflare staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: trinity-dialogue-staging (no public routes)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dedicated EU database: trinity-dialogue-staging-db" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production and existing Workers: untouched" >> "$GITHUB_STEP_SUMMARY"
