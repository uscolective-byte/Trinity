name: Trinity Dispatcher Build

on:
  push:
    branches: [main, feature/trinity-worker-delegation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Bundle dispatcher without deploying
        run: npx --no-install wrangler deploy --config workers/dispatcher/wrangler.toml --dry-run --outdir .wrangler/ci-dispatcher
