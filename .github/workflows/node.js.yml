name: Trinity Worker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trinity-worker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and bundle Cloudflare Worker
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Validate JavaScript entry points
        run: |
          node --check src/index.js
          node --check src/routes/ai.js
          node --check src/routes/dialogue.mjs
          node --check src/core/conversation.mjs
          node --check src/frontend/app.js

      - name: Build Cloudflare Worker without deploying
        run: npx wrangler deploy --dry-run --outdir .wrangler/ci-output

      - name: Summary
        if: always()
        run: |
          echo "### Trinity CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: validation only (no production deploy)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node.js: 22" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: unit tests, source syntax, Workers dry-run bundle" >> "$GITHUB_STEP_SUMMARY"
