name = "trinity-dispatcher"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

[observability]
enabled = true

# Required: set TRINITY_DELEGATION_SECRET as an encrypted secret.
# Each source Worker needs a service binding named TRINITY_DISPATCHER
# and the same secret. Helper bindings below must target REAL deployed services.
# Uncomment only AFTER verifying a service exists:
#
# [[services]]
# binding = "CODING_HELPER"
# service = "trinity-coding"
#
# [[services]]
# binding = "RESEARCH_HELPER"
# service = "trinity-research"
#
# [[services]]
# binding = "BROWSER_HELPER"
# service = "trinity-browser"
